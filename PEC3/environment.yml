# Entorno de la PEC 3 (M2.891). Versiones con las que se ha probado el notebook.
#   conda env create -f environment.yml
#   conda activate m2891-pec3
name: m2891-pec3
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5
  - pandas=3.0
  - scipy=1.18
  - scikit-learn=1.9
  - matplotlib=3.11
  - seaborn=0.13
  - shap=0.52
  - ipykernel
  - jupyterlab
  - nbconvert
